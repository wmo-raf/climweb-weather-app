# Explicit project name: without it, Compose derives one from this file's
# parent directory ("backend") — pinning it keeps container/volume/network
# names stable regardless of where the repo is checked out.
name: climweb-alerts-backend

services:
  db:
    image: postgis/postgis:16-3.4-alpine
    environment:
      POSTGRES_USER: climweb
      POSTGRES_PASSWORD: climweb
      POSTGRES_DB: climweb_alerts
    volumes:
      - alerts_db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U climweb -d climweb_alerts"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  migrate:
    image: climweb-alerts-backend:local
    build:
      context: .
    # Installs both this service's own schema (node-pg-migrate) and
    # graphile-worker's schema (backend/src/tasks — the alert-dispatch
    # queue) in the same place, before `backend` starts — avoids a race if
    # `backend` is ever scaled to more than one replica.
    command: ["sh", "-c", "node_modules/.bin/node-pg-migrate up && node_modules/.bin/graphile-worker --schema-only"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://climweb:climweb@db:5432/climweb_alerts
    depends_on:
      db:
        condition: service_healthy

  backend:
    image: climweb-alerts-backend:local
    build:
      context: .
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://climweb:climweb@db:5432/climweb_alerts
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  alerts_db_data:
